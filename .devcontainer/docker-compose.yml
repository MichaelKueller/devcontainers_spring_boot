version: '3.9'

services:
  app:
    build:
      context: /home/podman/devcontainers_spring_boot 
      dockerfile: ./Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image:  docker.io/library/mysql:8.0 # for podman this needs to be the fully qualified image name
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
