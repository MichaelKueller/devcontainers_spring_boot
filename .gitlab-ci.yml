stages:
  - build
  - push

variables:
  STORAGE_DRIVER: vfs

build-workspace-image:
  stage: build
  image: quay.io/buildah/stable:v1.33
  before_script:
    - dnf install -y make
  script:
    - mkdir -p /etc/containers
    - |
      cat > /etc/containers/containers.conf << EOF
      [containers]
      default_capabilities = []
      
      [engine]
      isolation = "chroot"
      EOF
    - capsh --decode=00000000a80405fb
    - echo "BUILDAH_ISOLATION=$BUILDAH_ISOLATION"
    - echo "whoami=$(whoami)"
    - buildah version
    - cat /proc/self/status | grep -E "^(Uid|Gid|CapEff)"
    - buildah --isolation chroot build -t workspace:latest -f workspace/Dockerfile workspace
    - make build-workspace-image
  artifacts:
    reports:
      dotenv: build.env
  only:
    - main

push-workspace-image:
  stage: push
  image: quay.io/buildah/stable
  before_script:
    - dnf install -y make
  script:
    - make push-workspace-image
  dependencies:
    - build-workspace-image
  only:
    - main
