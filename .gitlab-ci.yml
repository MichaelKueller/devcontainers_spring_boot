stages:
  - build
  - push

variables:
  STORAGE_DRIVER: vfs

build-workspace-image:
  stage: build
  image: quay.io/buildah/stable
  before_script:
    - dnf install -y make
  script:
    - echo "BUILDAH_ISOLATION=$BUILDAH_ISOLATION"
    - echo "whoami=$(whoami)"
    - buildah --isolation chroot build -t workspace:latest -f workspace/Dockerfile workspace
    - make build-workspace-image
  artifacts:
    reports:
      dotenv: build.env
  only:
    - main

push-workspace-image:
  stage: push
  image: quay.io/buildah/stable
  before_script:
    - dnf install -y make
  script:
    - make push-workspace-image
  dependencies:
    - build-workspace-image
  only:
    - main
