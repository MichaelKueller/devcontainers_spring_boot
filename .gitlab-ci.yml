stages:
  - build
  - push

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375

services:
  - name: docker:dind
    alias: docker

build-workspace-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache make
    - |
      until docker info > /dev/null 2>&1; do
        echo "Waiting for docker daemon..."
        sleep 1
      done
  script:
    - make build-workspace-image
  artifacts:
    reports:
      dotenv: build.env
  only:
    - main

push-workspace-image:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - make push-workspace-image
  dependencies:
    - build-workspace-image
  only:
    - main
