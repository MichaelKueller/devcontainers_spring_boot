stages:
  - build
  - push

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

build-workspace-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache make
  script:
    - make build-workspace-image
  artifacts:
    reports:
      dotenv: build.env
  only:
    - main

push-workspace-image:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - make push-workspace-image
  dependencies:
    - build-workspace-image
  only:
    - main
