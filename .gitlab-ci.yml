stages:
  - build
  - push

variables:
  BUILDAH_ISOLATION: chroot
  STORAGE_DRIVER: vfs
  BUILD_STORAGE_DRIVER: vfs
  CONTAINER_STORAGE_DRIVER: vfs

build-workspace-image:
  stage: build
  image: quay.io/buildah/stable
  before_script:
    - chmod u+s /usr/bin/newuidmap
    - chmod u+s /usr/bin/newgidmap
    - dnf install -y make
  script:
    - mkdir -p /etc/containers
    - |
      cat > /etc/containers/containers.conf << EOF
      [containers]
      default_capabilities = []
      
      [engine]
      isolation = "chroot"
      EOF

    - cat /etc/containers/containers.conf 2>/dev/null || echo "not found"
    - cat /etc/containers/storage.conf 2>/dev/null || echo "not found"
    - cat /usr/share/containers/containers.conf 2>/dev/null || echo "not found"

    - find / -name "newuidmap" 2>/dev/null
    - find / -name "newgidmap" 2>/dev/null

    - ls -la /usr/bin/newuidmap
    - ls -la /usr/bin/newgidmap

    - which newuidmap && ls -la $(which newuidmap)
    - which newgidmap && ls -la $(which newgidmap)
    - cat /etc/subuid
    - cat /etc/subgid

    - cat /proc/sys/user/max_user_namespaces
    - cat /proc/self/status | grep -E "^(Uid|Gid|CapEff|CapPrm)"
    - capsh --decode=$(grep CapEff /proc/self/status | awk '{print $2}')
    - capsh --decode=00000000a80405fb
    - echo "BUILDAH_ISOLATION=$BUILDAH_ISOLATION"
    - echo "whoami=$(whoami)"
    - buildah version
    - cat /proc/self/status | grep -E "^(Uid|Gid|CapEff)"
    - buildah --isolation chroot build -t workspace:latest -f workspace/Dockerfile workspace
    - make build-workspace-image
  artifacts:
    reports:
      dotenv: build.env
  only:
    - main

push-workspace-image:
  stage: push
  image: quay.io/buildah/stable
  before_script:
    - dnf install -y make
  script:
    - make push-workspace-image
  dependencies:
    - build-workspace-image
  only:
    - main
